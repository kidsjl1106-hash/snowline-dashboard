name: Snowline Health Check

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snowline-health-check
  cancel-in-progress: false

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check production dashboard and auth API
        shell: pwsh
        env:
          SNOWLINE_HEALTH_USER: ${{ secrets.SNOWLINE_HEALTH_USER }}
          SNOWLINE_HEALTH_PASSWORD: ${{ secrets.SNOWLINE_HEALTH_PASSWORD }}
        run: ./scripts/healthcheck.ps1
